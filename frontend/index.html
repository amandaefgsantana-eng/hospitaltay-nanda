
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hospital Hello Kitty</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: 'Nunito', sans-serif;

      background:
        radial-gradient(circle at 15% 20%, #ffffff 0 4px, transparent 5px),
        radial-gradient(circle at 80% 25%, #ffffff 0 5px, transparent 6px),
        radial-gradient(circle at 30% 80%, #ffffff 0 3px, transparent 4px),
        linear-gradient(135deg, #ffd9e8, #fff3f8);

      background-size:
        100px 100px,
        130px 130px,
        90px 90px,
        cover;
    }

    /* Cartão principal */
    .container {
      width: 370px;
      padding: 35px 32px 32px;

      background: rgba(255, 255, 255, 0.97);

      border: 4px solid #ff9fbe;
      border-radius: 30px;

      box-shadow:
        0 15px 35px rgba(214, 91, 132, 0.25),
        0 5px 0 #ffb8cf;

      text-align: center;

      position: relative;
    }

    /* Laços decorativos */
    .container::before,
    .container::after {
      content: "🎀";

      position: absolute;
      top: -27px;

      font-size: 40px;

      filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.12));
    }

    .container::before {
      left: 20px;
    }

    .container::after {
      right: 20px;
    }

    /* Título */
    h2 {
      margin: 8px 0 8px;

      color: #e83f78;

      font-size: 25px;
      font-weight: 800;

      text-shadow: 1px 2px 0 #ffd1e0;
    }

    .subtitulo {
      margin-bottom: 25px;

      color: #c97895;
      font-size: 14px;
      font-weight: 600;
    }

    /* Ícone médico */
    .icone-medico {
      width: 75px;
      height: 75px;

      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffe5ef;

      border: 3px solid #ffabc6;
      border-radius: 50%;

      font-size: 38px;

      box-shadow: 0 5px 0 #ffc5d8;
    }

    /* Campos */
    input {
      width: 100%;
      height: 50px;

      margin-bottom: 15px;
      padding: 0 18px;

      border: 2px solid #ffc1d5;
      border-radius: 18px;

      background: #fff8fb;

      color: #8b3b59;

      font-family: 'Nunito', sans-serif;
      font-size: 16px;

      outline: none;

      transition: 0.2s;
    }

    input::placeholder {
      color: #d99aae;
    }

    input:focus {
      border-color: #f36d9a;

      background: #ffffff;

      box-shadow:
        0 0 0 4px rgba(243, 109, 154, 0.12);
    }

    /* Botão */
    button {
      width: 100%;
      height: 52px;

      margin-top: 8px;

      border: none;
      border-radius: 20px;

      background: linear-gradient(
        135deg,
        #f45183,
        #e93670
      );

      color: white;

      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 800;

      cursor: pointer;

      box-shadow: 0 5px 0 #bd2859;

      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow: 0 7px 0 #bd2859;

      background: linear-gradient(
        135deg,
        #ff5d91,
        #ed3c76
      );
    }

    button:active {
      transform: translateY(3px);

      box-shadow: 0 2px 0 #bd2859;
    }

    /* Rodapé */
    .rodape {
      margin-top: 22px;

      color: #d28aa2;

      font-size: 12px;
      font-weight: 600;
    }

    .coracao {
      color: #ed477d;
    }

    /* Responsivo */
    @media (max-width: 450px) {
      .container {
        width: calc(100% - 30px);
        padding: 30px 25px;
      }

      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icone-medico">
      🩺
    </div>

    <h2>🎀 tay & nanda🎀</h2>

    <div class="subtitulo">
      Sistema Hospitalar
    </div>

    <input
      id="usuario"
      type="text"
      placeholder="👤 Usuário"
    >

    <input
      id="senha"
      type="password"
      placeholder="🔒 Senha"
    >

    <button onclick="login()">
      💗 Entrar
    </button>

    <div class="rodape">
      Cuidando com carinho <span class="coracao">♥</span>
    </div>

  </div>


  <script>
    function login() {

      fetch("http://localhost:3000/login", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          usuario: document.getElementById("usuario").value,
          senha: document.getElementById("senha").value
        })
      })

      .then(r => r.json())

      .then(data => {

        if (data.tipo === "triagem") {
          location.href = "triagem.html";
        }

        if (data.tipo === "medico") {
          location.href = "medico.html";
        }

        if (data.tipo === "atendimento") {
          location.href = "atendimento.html";
        }

      })

      .catch(error => {
        console.error("Erro no login:", error);

        alert("Não foi possível conectar ao servidor.");
      });
    }
  </script>

</body>
</html>
