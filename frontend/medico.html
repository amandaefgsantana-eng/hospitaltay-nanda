
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Painel Médico — Hospital Hello Kitty</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 30px 15px;

      font-family: 'Nunito', sans-serif;

      background:

        radial-gradient(
          circle at 10% 15%,
          #ffffff 0 4px,
          transparent 5px
        ),

        radial-gradient(
          circle at 85% 20%,
          #ffffff 0 5px,
          transparent 6px
        ),

        radial-gradient(
          circle at 20% 80%,
          #ffffff 0 4px,
          transparent 5px
        ),

        linear-gradient(
          135deg,
          #ffd9e8,
          #fff3f8
        );

      background-size:
        110px 110px,
        140px 140px,
        90px 90px,
        cover;
    }


    /* =================================
       CONTAINER
    ================================= */

    .container {

      width: 100%;

      max-width: 950px;

      margin: auto;

      padding: 30px;

      background:
        rgba(255,255,255,.97);

      border: 4px solid #ff9fbe;

      border-radius: 30px;

      box-shadow:

        0 15px 35px
        rgba(214,91,132,.22),

        0 5px 0
        #ffb8cf;

      position: relative;
    }


    /* LAÇOS */

    .container::before,
    .container::after {

      content: "🎀";

      position: absolute;

      top: -26px;

      font-size: 42px;

      filter:
        drop-shadow(
          2px 3px 2px
          rgba(0,0,0,.12)
        );
    }


    .container::before {
      left: 25px;
    }


    .container::after {
      right: 25px;
    }


    /* =================================
       CABEÇALHO
    ================================= */

    .cabecalho {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 25px;

      padding-bottom: 20px;

      border-bottom:
        2px dashed #ffc1d5;
    }


    .titulo-area {

      display: flex;

      align-items: center;

      gap: 15px;
    }


    .icone-medico {

      width: 65px;

      height: 65px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #ffe5ef;

      border: 3px solid #ffabc6;

      border-radius: 50%;

      font-size: 32px;

      box-shadow:
        0 4px 0 #ffc5d8;
    }


    h2 {

      margin: 0;

      color: #e83f78;

      font-size: 25px;

      font-weight: 900;

      text-shadow:
        1px 2px 0 #ffd1e0;
    }


    .subtitulo {

      margin-top: 3px;

      color: #c97895;

      font-size: 13px;

      font-weight: 600;
    }


    /* =================================
       BOTÃO TV
    ================================= */

    .btn-abrir-tv {

      padding: 11px 17px;

      border: none;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #f45183,
          #e93670
        );

      color: white;

      font-family:
        'Nunito', sans-serif;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 4px 0 #bd2859;

      transition: .15s;
    }


    .btn-abrir-tv:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 6px 0 #bd2859;
    }


    .btn-abrir-tv:active {

      transform:
        translateY(2px);

      box-shadow:
        0 2px 0 #bd2859;
    }


    /* =================================
       CONSULTÓRIO
    ================================= */

    .consultorio-input {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 22px;

      padding: 14px 17px;

      background: #fff2f7;

      border-radius: 18px;

      border: 2px solid #ffc5d8;

      color: #8b3b59;
    }


    .consultorio-input label {

      font-weight: 800;

      color: #d83d70;
    }


    .consultorio-input input {

      width: 70px;

      height: 42px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      padding: 5px 8px;

      border: 2px solid #ffabc6;

      border-radius: 13px;

      background: white;

      color: #d83d70;

      font-family:
        'Nunito', sans-serif;

      outline: none;
    }


    .consultorio-input input:focus {

      border-color:
        #e93670;

      box-shadow:
        0 0 0 4px
        rgba(243,109,154,.10);
    }


    .consultorio-info {

      color: #bd8095;

      font-size: 12px;

      font-weight: 600;
    }


    /* =================================
       TÍTULOS
    ================================= */

    .secao-titulo {

      color: #d83d70;

      font-size: 20px;

      font-weight: 900;

      margin: 25px 0 15px;
    }


    hr {

      border: none;

      border-top:
        2px dashed #ffc5d8;

      margin: 25px 0;
    }


    /* =================================
       CARDS DOS PACIENTES
    ================================= */

    #triagens {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(260px, 1fr)
        );

      gap: 15px;
    }


    .card {

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #fff7fa
        );

      border: 2px solid #ffc5d8;

      border-radius: 20px;

      padding: 18px;

      box-shadow:
        0 5px 12px
        rgba(214,91,132,.10);

      transition: .2s;

      position: relative;
    }


    .card::after {

      content: "♥";

      position: absolute;

      right: 15px;

      top: 12px;

      color: #ffd0df;

      font-size: 22px;
    }


    .card:hover {

      transform:
        translateY(-3px);

      border-color:
        #ff9fbe;

      box-shadow:
        0 8px 18px
        rgba(214,91,132,.15);
    }


    .card h3 {

      margin: 0 0 12px;

      color: #e83f78;

      font-size: 19px;

      font-weight: 900;
    }


    .card p {

      margin: 7px 0;

      color: #8b6171;

      font-size: 13px;
    }


    .card p b {

      color: #a84968;
    }


    /* =================================
       CLASSIFICAÇÃO DE RISCO
    ================================= */

    .card .verde,
    .card .amarelo,
    .card .vermelho {

      display: inline-block;

      padding: 5px 12px;

      border-radius: 12px;

      font-size: 12px;

      font-weight: 900;

      text-transform: uppercase;
    }


    .verde {

      background: #dff6e7;

      color: #218838;

      border: 1px solid #9edcaf;
    }


    .amarelo {

      background: #fff4cf;

      color: #a87800;

      border: 1px solid #f2d474;
    }


    .vermelho {

      background: #ffe0e5;

      color: #d62839;

      border: 1px solid #ff9da8;
    }


    /* =================================
       BOTÕES DOS CARDS
    ================================= */

    .acoes {

      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-top: 14px;
    }


    .btn-atender {

      background:
        linear-gradient(
          135deg,
          #f45183,
          #e93670
        );

      color: white;

      border: none;

      padding: 9px 14px;

      border-radius: 14px;

      cursor: pointer;

      font-family:
        'Nunito', sans-serif;

      font-size: 13px;

      font-weight: 800;

      box-shadow:
        0 3px 0 #bd2859;

      transition: .15s;
    }


    .btn-atender:hover {

      transform:
        translateY(-1px);

      background:
        #ed3c76;
    }


    .btn-tv {

      background: #ffabc6;

      color: white;

      border: none;

      padding: 9px 14px;

      border-radius: 14px;

      cursor: pointer;

      font-family:
        'Nunito', sans-serif;

      font-size: 13px;

      font-weight: 800;

      box-shadow:
        0 3px 0 #dc6d91;

      transition: .15s;
    }


    .btn-tv:hover {

      background: #f45183;

      transform:
        translateY(-1px);
    }



    /* =================================
       BOTÃO DE ALTA
    ================================= */

    .btn-internacao {
      background: #8c9de8;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 3px 0 #6575bd;
      transition: .15s;
    }
    .btn-internacao:hover { background: #7486dc; transform: translateY(-1px); }

    .btn-alta {

      background: #8fc9a3;

      color: white;

      border: none;

      padding: 9px 14px;

      border-radius: 14px;

      cursor: pointer;

      font-family: 'Nunito', sans-serif;

      font-size: 13px;

      font-weight: 800;

      box-shadow: 0 3px 0 #5d9d73;

      transition: .15s;
    }

    .btn-alta:hover {

      background: #75b98d;

      transform: translateY(-1px);
    }

    /* =================================
       FORMULÁRIO DA CONSULTA
    ================================= */

    .consulta-area {

      background: #fff7fa;

      border: 2px solid #ffc5d8;

      border-radius: 22px;

      padding: 20px;
    }


    input,
    select,
    textarea {

      width: 100%;

      margin-bottom: 14px;

      padding: 13px 16px;

      border: 2px solid #ffc5d8;

      border-radius: 16px;

      background: #fffafd;

      color: #8b3b59;

      font-family:
        'Nunito', sans-serif;

      font-size: 15px;

      outline: none;

      transition: .2s;
    }


    input,
    select {

      height: 50px;
    }


    textarea {

      min-height: 110px;

      resize: vertical;
    }


    input::placeholder,
    textarea::placeholder {

      color: #d49aad;
    }


    input:focus,
    select:focus,
    textarea:focus {

      border-color:
        #f36d9a;

      background: white;

      box-shadow:
        0 0 0 4px
        rgba(243,109,154,.10);
    }


    /* =================================
       PACIENTE SELECIONADO
    ================================= */

    #paciente {

      background: #ffe9f1;

      color: #d83d70;

      font-weight: 900;
    }


    /* =================================
       BOTÃO SALVAR
    ================================= */

    .btn-salvar {

      width: 100%;

      height: 53px;

      border: none;

      border-radius: 19px;

      background:
        linear-gradient(
          135deg,
          #f45183,
          #e93670
        );

      color: white;

      font-family:
        'Nunito', sans-serif;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0 #bd2859;

      transition: .15s;
    }


    .btn-salvar:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 7px 0 #bd2859;

      background:
        linear-gradient(
          135deg,
          #ff5d91,
          #ed3c76
        );
    }


    .btn-salvar:active {

      transform:
        translateY(3px);

      box-shadow:
        0 2px 0 #bd2859;
    }


    /* =================================
       RODAPÉ
    ================================= */

    .rodape {

      margin-top: 20px;

      text-align: center;

      color: #d28aa2;

      font-size: 12px;

      font-weight: 600;
    }


    .coracao {

      color: #ed477d;
    }


    /* =================================
       RESPONSIVO
    ================================= */

    @media (max-width: 700px) {

      .container {

        padding: 25px 20px;
      }


      .cabecalho {

        flex-direction: column;

        align-items: stretch;
      }


      .titulo-area {

        justify-content: center;
      }


      .btn-abrir-tv {

        width: 100%;
      }


      .consultorio-input {

        flex-wrap: wrap;
      }


      #triagens {

        grid-template-columns:
          1fr;
      }

    }


    @media (max-width: 450px) {

      h2 {

        font-size: 21px;
      }


      .icone-medico {

        width: 55px;

        height: 55px;

        font-size: 27px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =================================
       CABEÇALHO
  ================================== -->

  <div class="cabecalho">

    <div class="titulo-area">

      <div class="icone-medico">
        🩺
      </div>

      <div>

        <h2>
          🎀 Painel Médico
        </h2>

        <div class="subtitulo">
          🏥 Hospital Hello Kitty • Área Médica
        </div>

      </div>

    </div>


    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')">

      📺 Abrir Tela da TV

    </button>

  </div>


  <!-- =================================
       CONSULTÓRIO
  ================================== -->

  <div class="consultorio-input">

    <label>
      🩺 Meu Consultório:
    </label>


    <input
      type="text"
      id="consultorio-num"
      value="01"
      maxlength="3"
    >


    <span class="consultorio-info">

      Este número será exibido na TV
      ao chamar o paciente.

    </span>

  </div>


  <!-- =================================
       PACIENTES
  ================================== -->

  <div class="secao-titulo">

    💗 Pacientes aguardando atendimento

  </div>


  <div id="triagens">

    <p style="
      color:#c08b9d;
      text-align:center;
      grid-column:1/-1;
    ">

      🎀 Carregando pacientes...

    </p>

  </div>


  <hr>


  <!-- =================================
       CONSULTA
  ================================== -->

  <div class="secao-titulo">

    🩷 Consulta

  </div>


  <div class="consulta-area">


    <input
      id="paciente"
      placeholder="👤 Paciente"
      readonly
    >


    <input
      id="diagnostico"
      placeholder="🩺 Diagnóstico"
    >


    <select id="medicacao">

      <option value="">
        💊 Selecione a medicação
      </option>

    </select>


    <textarea
      id="obs"
      placeholder="📝 Observações"
    ></textarea>


    <button
      class="btn-salvar"
      onclick="salvar()">

      💗 Salvar Consulta

    </button>

  </div>


  <div class="rodape">

    Cuidando com carinho
    <span class="coracao">♥</span>
    Hospital Hello Kitty

  </div>


</div>


<script>


let triagensCarregadas = [];


/*
=====================================
CARREGAR TRIAGENS
=====================================
*/

function carregar() {

  fetch("/triagens")

    .then(r => r.json())

    .then(data => {

      triagensCarregadas = data;


      const div =
        document.getElementById(
          "triagens"
        );


      div.innerHTML = "";


      if (data.length === 0) {

        div.innerHTML = `
          <p style="
            color:#c08b9d;
            text-align:center;
            grid-column:1/-1;
            padding:20px;
          ">
            🎀 Nenhum paciente na fila.
          </p>
        `;

        return;
      }


      data.forEach((t, index) => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card";


        card.innerHTML = `

          <h3>
            💗 ${t.nome}
          </h3>

          <p>
            <b>🩺 Sintoma:</b>
            ${t.sintoma || "Não informado"}
          </p>

          <p>
            <b>🌡️ Temperatura:</b>
            ${t.temperatura || "Não informada"}°C
          </p>

          <p>
            <b>🚦 Risco:</b>
            <span class="${t.risco}">
              ${t.risco}
            </span>
          </p>

          <p>
            <b>💊 Alergia:</b>
            ${t.alergia || "Nenhuma"}
          </p>

          <p>
            <b>📝 Observação:</b>
            ${t.observacao || "Nenhuma"}
          </p>

          <div class="acoes">

            <button
              class="btn-atender"
              onclick="selecionar(${index})">

              🩺 Atender

            </button>

            <button
              class="btn-tv"
              onclick="chamarNaTV('${t.nome}')">

              📺 Chamar na TV

            </button>

            <button
  class="btn-alta"
  onclick="abrirAlta(${index})">

  🏠 Dar Alta

</button>


          </div>

        `;


        div.appendChild(card);

      });

    })

    .catch(error => {

      console.log(
        "Erro ao carregar triagens:",
        error
      );

    });

}


/*
=====================================
CHAMAR PACIENTE NA TV
=====================================
*/


/*
=====================================
ABRIR FORMULÁRIO DE ALTA
=====================================
*/

function abrirAlta(index) {

  const t = triagensCarregadas[index];

  localStorage.setItem(
    "pacienteAlta",
    JSON.stringify(t)
  );

  window.open("alta.html", "_blank");
}


function chamarNaTV(nome) {

  const consultorio =
    document.getElementById(
      "consultorio-num"
    ).value || "01";


  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type":
        "application/json"
    },

    body: JSON.stringify({

      localTipo:
        "CONSULTÓRIO",

      localNumero:
        consultorio,

      paciente:
        nome

    })

  })


  .then(r => r.json())


  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  })

  .catch(() => {

    alert(
      "❌ Não foi possível chamar o paciente na TV."
    );

  });

}


/*
=====================================
SELECIONAR PACIENTE
=====================================
*/

function selecionar(index) {

  const t =
    triagensCarregadas[index];


  document.getElementById(
    "paciente"
  ).value = t.nome;


  document.getElementById(
    "obs"
  ).value =
    t.observacao || "";


  if (
    t.alergia &&
    t.alergia !== "Nenhuma"
  ) {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}


/*
=====================================
CARREGAR MEDICAÇÕES
=====================================
*/

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById(
          "medicacao"
        );


      select.innerHTML = `

        <option value="">
          💊 Selecione a medicação
        </option>

      `;


      data.forEach(med => {

        const option =
          document.createElement(
            "option"
          );


        option.value = med;

        option.textContent = med;


        select.appendChild(
          option
        );

      });

    })

    .catch(error => {

      console.log(
        "Erro ao carregar medicações:",
        error
      );

    });

}


/*
=====================================
SALVAR CONSULTA
=====================================
*/

function salvar() {

  const paciente =
    document.getElementById(
      "paciente"
    ).value;


  const diagnostico =
    document.getElementById(
      "diagnostico"
    ).value;


  const medicacao =
    document.getElementById(
      "medicacao"
    ).value;


  const obs =
    document.getElementById(
      "obs"
    ).value;


  if (!paciente) {

    alert(
      "🎀 Selecione um paciente clicando em Atender."
    );

    return;
  }


  if (!medicacao) {

    alert(
      "💊 Selecione uma medicação."
    );

    return;
  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type":
        "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })


  .then(r => r.json())


  .then(() => {

    alert(
      "💗 Consulta salva com sucesso!"
    );


    document.getElementById(
      "paciente"
    ).value = "";


    document.getElementById(
      "diagnostico"
    ).value = "";


    document.getElementById(
      "medicacao"
    ).value = "";


    document.getElementById(
      "obs"
    ).value = "";


    carregar();

  })

  .catch(() => {

    alert(
      "❌ Erro ao salvar a consulta."
    );

  });

}


/*
=====================================
INICIALIZAÇÃO
=====================================
*/

carregar();

carregarMedicacoes();


/*
=====================================
ATUALIZA A FILA A CADA 10 SEGUNDOS
=====================================
*/

setInterval(
  carregar,
  10000
);

</script>


</body>

</html>
```
