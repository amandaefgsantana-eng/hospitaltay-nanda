<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Internação — Hospital Hello Kitty</title><style>body{font-family:Arial,sans-serif;background:#f4f5ff;margin:0;padding:25px}.container{max-width:900px;margin:auto;background:#fff;border:3px solid #aebaff;border-radius:25px;padding:30px}h1{color:#596bc9;text-align:center}h2{color:#596bc9;font-size:18px}.dados{display:grid;grid-template-columns:1fr 1fr;gap:12px}.campo{padding:14px;background:#f7f8ff;border:1px solid #cbd2ff;border-radius:12px}.campo strong{display:block;color:#596bc9;margin-bottom:6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:2px solid #cbd2ff;border-radius:12px;margin:5px 0 12px;font-size:15px}textarea{min-height:100px}.botoes{display:flex;gap:12px;margin-top:20px}button{flex:1;padding:14px;border:0;border-radius:14px;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}.pdf{background:#596bc9}.voltar{background:#aebaff}@media print{@page{size:A4;margin:15mm}body{background:#fff;padding:0}.container{border:0;padding:0}.botoes{display:none}input,textarea{border:0}.campo{break-inside:avoid}}@media(max-width:600px){.dados{grid-template-columns:1fr}.botoes{flex-direction:column}}</style></head><body><div class="container"><h1>🛏️ Formulário de Internação</h1><p style="text-align:center;color:#888">🏥 Hospital Hello Kitty • Área Médica</p><div class="dados"><div class="campo"><strong>👤 Paciente</strong><span id="nome">—</span></div><div class="campo"><strong>🌡️ Temperatura</strong><span id="temperatura">—</span></div><div class="campo"><strong>🩺 Sintoma</strong><span id="sintoma">—</span></div><div class="campo"><strong>🚦 Risco</strong><span id="risco">—</span></div><div class="campo"><strong>💊 Alergia</strong><span id="alergia">—</span></div><div><label>📅 Data da internação</label><input id="data" type="date"></div></div><div class="dados"><div><label>🛏️ Leito</label><input id="leito" placeholder="Ex.: 12"></div><div><label>🏥 Setor / Ala</label><input id="setor" placeholder="Ex.: Clínica Médica"></div></div><h2>🩺 Motivo da internação</h2><textarea id="motivo" placeholder="Descreva o motivo e a indicação da internação..."></textarea><h2>📋 Diagnóstico / Conduta</h2><textarea id="diagnostico" placeholder="Informe o diagnóstico e a conduta médica..."></textarea><h2>💊 Prescrição inicial</h2><textarea id="prescricao" placeholder="Medicamentos, cuidados, exames e orientações..."></textarea><div class="dados"><div><label>👨‍⚕️ Médico responsável</label><input id="medico" placeholder="Nome do médico"></div><div><label>📋 CRM</label><input id="crm" placeholder="Número do CRM"></div></div><div class="botoes"><button class="voltar" onclick="window.close()">← Voltar</button><button class="pdf" onclick="gerarPDF()">📄 Transformar em PDF</button></div></div><script>const d=JSON.parse(localStorage.getItem('pacienteInternacao'));if(d){nome.textContent=d.nome||'Não informado';temperatura.textContent=d.temperatura!==undefined&&d.temperatura!==''?d.temperatura+'°C':'Não informada';sintoma.textContent=d.sintoma||'Não informado';risco.textContent=d.risco||'Não informado';alergia.textContent=d.alergia||'Nenhuma'}data.value=new Date().toISOString().split('T')[0];function gerarPDF(){if(!motivo.value.trim()){alert('🩺 Preencha o motivo da internação.');motivo.focus();return}if(!medico.value.trim()){alert('👨‍⚕️ Informe o médico responsável.');medico.focus();return}window.print()}</script></body></html>
